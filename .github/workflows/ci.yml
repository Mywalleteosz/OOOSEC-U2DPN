name: OOOSEC CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          for requirements in \
            simple-bot/requirements.txt \
            telegram-openai-bot/requirements.txt; do
            if [ -f "$requirements" ]; then
              python -m pip install -r "$requirements"
            fi
          done

      - name: Python syntax check
        run: python -m compileall -q simple-bot telegram-openai-bot

  node-check:
    name: Node Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check API package when source is available
        run: |
          if [ -f apps/package.json ]; then
            cd apps
            npm ci
          else
            echo "::warning::API source is not checked out; apps is a gitlink without .gitmodules metadata."
          fi

      - name: Node syntax check
        run: |
          if [ -f apps/index.js ]; then
            node --check apps/index.js
          fi

  docker-check:
    name: Docker Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Telegram bot image
        run: docker compose build bot
