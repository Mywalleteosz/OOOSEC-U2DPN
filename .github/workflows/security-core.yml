name: Security Core

on:
  push:
    branches:
      - main
      - master
      - "security/**"
  pull_request:
    branches:
      - main
      - master
      - "security/**"

permissions:
  contents: read

jobs:
  security-core:
    name: Security Core tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: security-core/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r security-core/requirements.txt

      - name: Compile
        run: python -m compileall -q security-core/app

      - name: Unit tests
        working-directory: security-core
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Dependency audit
        run: pip-audit -r security-core/requirements.txt

      - name: Bandit
        run: bandit -q -r security-core/app
