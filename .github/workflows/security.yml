name: Security

on:
  push:
    branches:
      - master
      - main
      - "security/**"
  pull_request:
    branches:
      - master
      - main
      - "security/**"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  python-audit:
    name: Python dependency and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit bandit

      - name: Audit Python dependencies
        run: |
          pip-audit -r telegram-openai-bot/requirements.txt
          pip-audit -r simple-bot/requirements.txt

      - name: Run Bandit
        run: |
          bandit -q -r telegram-openai-bot simple-bot

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
